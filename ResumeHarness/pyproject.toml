[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-agent"
version = "0.1.0"
description = "简历智能体 - 基于 OpenHarness 的简历优化 Agent"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "resume-agent-team" },
]

dependencies = [
    # Web 框架
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",

    # LLM API
    "openai>=1.0.0",

    # 数据模型
    "pydantic>=2.0.0",

    # HTTP 客户端
    "httpx>=0.27.0",

    # 环境变量管理
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
resume-agent = "backend.app:main"

[tool.hatch.build.targets.wheel]
packages = ["resume_agent", "backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
