<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Agent - P1 验证页面</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }

        /* 顶部导航 */
        .navbar { background: #1a1a2e; color: #fff; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
        .navbar h1 { font-size: 18px; font-weight: 600; }
        .navbar .tabs { display: flex; gap: 4px; margin-left: auto; }
        .navbar .tab { padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #aaa; transition: all .2s; }
        .navbar .tab:hover { color: #fff; }
        .navbar .tab.active { background: #6c5ce7; color: #fff; }

        /* 面板 */
        .panel { display: none; max-width: 1000px; margin: 24px auto; padding: 0 20px; }
        .panel.active { display: block; }

        /* 对话面板 */
        .chat-box { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); overflow: hidden; }
        .messages { height: 480px; overflow-y: auto; padding: 20px; }
        .msg { margin-bottom: 16px; }
        .msg-user { text-align: right; }
        .msg-assistant { text-align: left; }
        .msg-bubble { display: inline-block; max-width: 80%; padding: 10px 16px; border-radius: 12px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
        .msg-user .msg-bubble { background: #6c5ce7; color: #fff; }
        .msg-assistant .msg-bubble { background: #f0f0f0; color: #333; }
        .msg-tool { font-size: 12px; color: #888; margin: 4px 0; padding: 4px 8px; background: #f9f9f9; border-radius: 4px; }
        .msg-resume { font-size: 13px; color: #6c5ce7; margin: 4px 0; padding: 6px 10px; background: #f0ecff; border-radius: 6px; cursor: pointer; }
        .msg-resume:hover { background: #e0d9ff; }
        .input-area { display: flex; padding: 16px; border-top: 1px solid #eee; gap: 8px; }
        .input-area input { flex: 1; padding: 10px 16px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
        .input-area input:focus { border-color: #6c5ce7; }
        .input-area button { padding: 10px 24px; background: #6c5ce7; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; }
        .input-area button:hover { background: #5a4bd1; }
        .input-area button:disabled { background: #ccc; cursor: not-allowed; }
        .status { padding: 8px 20px; font-size: 12px; color: #999; }
        .error { color: #e74c3c; }

        /* 卡片 */
        .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 20px; margin-bottom: 16px; }
        .card h2 { font-size: 16px; margin-bottom: 12px; color: #1a1a2e; }
        .card h3 { font-size: 14px; margin: 12px 0 8px; color: #444; }

        /* 按钮 */
        .btn { padding: 8px 16px; border: none; border-radius: 6px; font-size: 13px; cursor: pointer; transition: all .2s; }
        .btn-primary { background: #6c5ce7; color: #fff; }
        .btn-primary:hover { background: #5a4bd1; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .btn-sm { padding: 4px 12px; font-size: 12px; }
        .btn-outline { background: #fff; border: 1px solid #6c5ce7; color: #6c5ce7; }
        .btn-outline:hover { background: #f0ecff; }

        /* 表格 */
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 8px 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { color: #666; font-weight: 500; }

        /* 表单 */
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 13px; color: #666; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none;
        }
        .form-group textarea { min-height: 80px; resize: vertical; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #6c5ce7; }

        /* 简历预览 */
        .resume-preview { border: 1px solid #eee; border-radius: 8px; padding: 20px; min-height: 400px; }
        .resume-preview iframe { width: 100%; height: 500px; border: none; }

        /* 标签 */
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
        .badge-green { background: #e8f5e9; color: #2e7d32; }
        .badge-blue { background: #e3f2fd; color: #1565c0; }
        .badge-red { background: #ffebee; color: #c62828; }

        /* 两栏布局 */
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        /* 加载动画 */
        .loading { text-align: center; padding: 20px; color: #999; }
        .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #ddd; border-top-color: #6c5ce7; border-radius: 50%; animation: spin 0.6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 代码块 */
        pre { background: #f5f5f5; padding: 12px; border-radius: 6px; font-size: 12px; overflow-x: auto; }
        code { font-family: "Consolas", monospace; }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>Resume Agent</h1>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('chat')">对话</div>
            <div class="tab" onclick="switchTab('memory')">记忆管理</div>
            <div class="tab" onclick="switchTab('resume')">简历下载</div>
            <div class="tab" onclick="switchTab('tools')">工具/技能</div>
            <div class="tab" onclick="switchTab('settings')">配置</div>
        </div>
    </div>

    <!-- 对话面板 -->
    <div class="panel active" id="panel-chat">
        <div class="chat-box">
            <div class="messages" id="messages"></div>
            <div class="status" id="status">就绪</div>
            <div class="input-area">
                <input type="text" id="promptInput" placeholder="输入消息，如：帮我优化简历..." />
                <button id="sendBtn" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <!-- 记忆管理面板 -->
    <div class="panel" id="panel-memory">
        <div class="two-col">
            <div class="card">
                <h2>记忆文档列表</h2>
                <div id="memoryList"><div class="loading">加载中...</div></div>
            </div>
            <div>
                <div class="card">
                    <h2>上传简历原文</h2>
                    <div class="form-group">
                        <label>选择文件（.md / .txt）</label>
                        <input type="file" id="resumeFileInput" accept=".md,.txt" />
                    </div>
                    <button class="btn btn-primary" onclick="uploadResume()">上传</button>
                </div>
                <div class="card">
                    <h2>编辑记忆文档</h2>
                    <div class="form-group">
                        <label>文件名</label>
                        <select id="memoryDocSelect">
                            <option value="职业偏好.md">职业偏好.md</option>
                            <option value="技能标签.md">技能标签.md</option>
                            <option value="优化历史.md">优化历史.md</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>内容</label>
                        <textarea id="memoryContentInput" placeholder="输入记忆内容（Markdown 格式）"></textarea>
                    </div>
                    <div style="display:flex;gap:8px">
                        <button class="btn btn-primary" onclick="updateMemory('replace')">替换</button>
                        <button class="btn btn-outline" onclick="updateMemory('append')">追加</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 简历下载面板 -->
    <div class="panel" id="panel-resume">
        <div class="two-col">
            <div class="card">
                <h2>简历快照列表</h2>
                <div id="resumeList"><div class="loading">加载中...</div></div>
            </div>
            <div class="card">
                <h2>简历预览</h2>
                <div class="form-group" style="display:flex;gap:8px;align-items:end;">
                    <div style="flex:1">
                        <label>模板</label>
                        <select id="previewTemplate">
                            <option value="professional">简洁商务</option>
                            <option value="academic">学术风格</option>
                            <option value="creative">创意排版</option>
                        </select>
                    </div>
                    <button class="btn btn-outline" onclick="previewResume()">预览</button>
                    <button class="btn btn-primary" onclick="downloadResume('pdf')">下载PDF</button>
                    <button class="btn btn-outline" onclick="downloadResume('markdown')">下载MD</button>
                </div>
                <div class="resume-preview" id="resumePreview">
                    <p style="color:#999;text-align:center;padding:40px">选择简历快照后点击预览</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 工具/技能面板 -->
    <div class="panel" id="panel-tools">
        <div class="two-col">
            <div class="card">
                <h2>可用工具</h2>
                <div id="toolsList"><div class="loading">加载中...</div></div>
            </div>
            <div>
                <div class="card">
                    <h2>技能列表</h2>
                    <div id="skillsList"><div class="loading">加载中...</div></div>
                </div>
                <div class="card">
                    <h2>MCP 状态</h2>
                    <div id="mcpStatus"><div class="loading">加载中...</div></div>
                </div>
                <div class="card">
                    <h2>历史会话</h2>
                    <div id="sessionsList"><div class="loading">加载中...</div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 配置面板 -->
    <div class="panel" id="panel-settings">
        <div class="card">
            <h2>用户配置</h2>
            <div class="two-col">
                <div>
                    <div class="form-group">
                        <label>默认简历模板</label>
                        <select id="settingTemplate">
                            <option value="professional">简洁商务</option>
                            <option value="academic">学术风格</option>
                            <option value="creative">创意排版</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>语言风格</label>
                        <select id="settingStyle">
                            <option value="professional">专业</option>
                            <option value="casual">轻松</option>
                            <option value="academic">学术</option>
                        </select>
                    </div>
                </div>
                <div>
                    <div class="form-group">
                        <label>输出语言</label>
                        <select id="settingLang">
                            <option value="zh-CN">中文</option>
                            <option value="en-US">English</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>自动保存简历</label>
                        <select id="settingAutoSave">
                            <option value="true">是</option>
                            <option value="false">否</option>
                        </select>
                    </div>
                </div>
            </div>
            <button class="btn btn-primary" onclick="saveSettings()" style="margin-top:8px">保存配置</button>
        </div>
    </div>

    <script>
        // ---- 全局状态 ----
        let currentSessionId = null;
        let selectedResumeId = null;

        // ---- Tab 切换 ----
        function switchTab(name) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('panel-' + name).classList.add('active');
            event.target.classList.add('active');
            // 切换时刷新数据
            if (name === 'memory') loadMemoryList();
            if (name === 'resume') loadResumeList();
            if (name === 'tools') { loadTools(); loadSkills(); loadMcpStatus(); loadSessions(); }
            if (name === 'settings') loadSettings();
        }

        // ---- 对话功能 ----
        const messagesEl = document.getElementById('messages');
        const statusEl = document.getElementById('status');
        const inputEl = document.getElementById('promptInput');
        const sendBtn = document.getElementById('sendBtn');

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        function addMessage(role, text) {
            const div = document.createElement('div');
            div.className = `msg msg-${role}`;
            div.innerHTML = `<div class="msg-bubble">${escapeHtml(text)}</div>`;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function addToolInfo(toolName, info) {
            const div = document.createElement('div');
            div.className = 'msg-tool';
            div.textContent = `[工具] ${toolName}: ${info}`;
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function addResumeNotification(resumeId) {
            const div = document.createElement('div');
            div.className = 'msg-resume';
            div.textContent = `📄 简历已自动保存！resume_id: ${resumeId}  (点击跳转到简历面板)`;
            div.onclick = () => { selectedResumeId = resumeId; switchTabDirect('resume'); };
            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function switchTabDirect(name) {
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('panel-' + name).classList.add('active');
            document.querySelectorAll('.tab').forEach(t => { if (t.textContent.includes(name === 'resume' ? '简历' : name === 'memory' ? '记忆' : name)) t.classList.add('active'); });
            if (name === 'resume') loadResumeList();
        }

        async function sendMessage() {
            const prompt = inputEl.value.trim();
            if (!prompt) return;
            inputEl.value = '';
            sendBtn.disabled = true;
            statusEl.textContent = '发送中...';
            addMessage('user', prompt);

            try {
                const body = { prompt };
                if (currentSessionId) body.session_id = currentSessionId;

                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let assistantText = '';
                let hasAssistantBubble = false;
                statusEl.textContent = '接收中...';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');
                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const jsonStr = line.slice(6).trim();
                        if (!jsonStr) continue;
                        try {
                            const event = JSON.parse(jsonStr);
                            if (event.type === 'text_delta') {
                                if (!hasAssistantBubble) { addMessage('assistant', ''); hasAssistantBubble = true; }
                                assistantText += event.text;
                                const lastBubble = messagesEl.querySelector('.msg-assistant:last-child .msg-bubble');
                                if (lastBubble) { lastBubble.textContent = assistantText; messagesEl.scrollTop = messagesEl.scrollHeight; }
                            } else if (event.type === 'tool_execution_started') {
                                addToolInfo(event.tool_name, '执行中...');
                            } else if (event.type === 'tool_execution_completed') {
                                const output = event.output.length > 100 ? event.output.substring(0, 100) + '...' : event.output;
                                addToolInfo(event.tool_name, event.is_error ? `❌ ${output}` : `✅ ${output}`);
                            } else if (event.type === 'resume_generated') {
                                addResumeNotification(event.resume_id);
                            } else if (event.type === 'error') {
                                statusEl.textContent = `错误: ${event.message}`;
                                statusEl.className = 'status error';
                            } else if (event.type === 'assistant_turn_complete') {
                                statusEl.textContent = '就绪';
                                statusEl.className = 'status';
                            }
                        } catch (e) {}
                    }
                }
            } catch (err) {
                addMessage('assistant', `连接失败: ${err.message}`);
                statusEl.textContent = '连接失败';
                statusEl.className = 'status error';
            }
            sendBtn.disabled = false;
            inputEl.focus();
        }

        // ---- 记忆管理 ----
        async function loadMemoryList() {
            const el = document.getElementById('memoryList');
            el.innerHTML = '<div class="loading"><span class="spinner"></span></div>';
            try {
                const res = await fetch('/api/memory');
                const data = await res.json();
                if (!data.documents || data.documents.length === 0) {
                    el.innerHTML = '<p style="color:#999">暂无记忆文档</p>';
                    return;
                }
                el.innerHTML = '<table><tr><th>文件名</th><th>大小</th><th>可写</th><th>操作</th></tr>' +
                    data.documents.map(d => `<tr>
                        <td>${d.name}</td>
                        <td>${(d.size_bytes / 1024).toFixed(1)} KB</td>
                        <td>${d.writable ? '<span class="badge badge-green">可写</span>' : '<span class="badge badge-blue">只读</span>'}</td>
                        <td><button class="btn btn-sm btn-outline" onclick="viewMemory('${d.name}')">查看</button>
                            ${d.writable ? `<button class="btn btn-sm btn-danger" onclick="deleteMemory('${d.name}')" style="margin-left:4px">删除</button>` : ''}
                        </td>
                    </tr>`).join('') + '</table>';
            } catch (e) { el.innerHTML = `<p class="error">加载失败: ${e.message}</p>`; }
        }

        async function viewMemory(name) {
            try {
                const res = await fetch(`/api/memory/${encodeURIComponent(name)}`);
                const data = await res.json();
                if (data.content) {
                    document.getElementById('memoryDocSelect').value = name;
                    document.getElementById('memoryContentInput').value = data.content;
                }
            } catch (e) { alert('加载失败: ' + e.message); }
        }

        async function updateMemory(mode) {
            const docName = document.getElementById('memoryDocSelect').value;
            const content = document.getElementById('memoryContentInput').value;
            if (!content.trim()) return alert('内容不能为空');
            try {
                const res = await fetch(`/api/memory/${encodeURIComponent(docName)}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content, mode }),
                });
                const data = await res.json();
                if (res.ok) { alert('保存成功'); loadMemoryList(); }
                else { alert('保存失败: ' + data.detail); }
            } catch (e) { alert('保存失败: ' + e.message); }
        }

        async function deleteMemory(name) {
            if (!confirm(`确定删除 ${name}？`)) return;
            try {
                const res = await fetch(`/api/memory/${encodeURIComponent(name)}`, { method: 'DELETE' });
                if (res.ok) { alert('删除成功'); loadMemoryList(); }
                else { const data = await res.json(); alert('删除失败: ' + data.detail); }
            } catch (e) { alert('删除失败: ' + e.message); }
        }

        async function uploadResume() {
            const input = document.getElementById('resumeFileInput');
            if (!input.files.length) return alert('请选择文件');
            const formData = new FormData();
            formData.append('file', input.files[0]);
            try {
                const res = await fetch('/api/memory/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (res.ok) { alert('上传成功'); loadMemoryList(); }
                else { alert('上传失败: ' + data.detail); }
            } catch (e) { alert('上传失败: ' + e.message); }
        }

        // ---- 简历管理 ----
        async function loadResumeList() {
            const el = document.getElementById('resumeList');
            el.innerHTML = '<div class="loading"><span class="spinner"></span></div>';
            try {
                const res = await fetch('/api/resume');
                const data = await res.json();
                if (!data.resumes || data.resumes.length === 0) {
                    el.innerHTML = '<p style="color:#999">暂无简历快照。在对话中生成简历后会自动保存。</p>';
                    return;
                }
                el.innerHTML = '<table><tr><th>简历 ID</th><th>创建时间</th><th>大小</th><th>操作</th></tr>' +
                    data.resumes.map(r => {
                        const date = new Date(r.created_at * 1000).toLocaleString();
                        const isSelected = r.resume_id === selectedResumeId;
                        return `<tr style="${isSelected ? 'background:#f0ecff' : ''}">
                            <td style="font-size:12px;font-family:monospace">${r.resume_id}</td>
                            <td style="font-size:12px">${date}</td>
                            <td>${(r.size_bytes / 1024).toFixed(1)} KB</td>
                            <td>
                                <button class="btn btn-sm btn-primary" onclick="selectResume('${r.resume_id}')">选择</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteResume('${r.resume_id}')" style="margin-left:4px">删除</button>
                            </td>
                        </tr>`;
                    }).join('') + '</table>';
            } catch (e) { el.innerHTML = `<p class="error">加载失败: ${e.message}</p>`; }
        }

        function selectResume(id) { selectedResumeId = id; loadResumeList(); }

        async function previewResume() {
            if (!selectedResumeId) return alert('请先选择一个简历快照');
            const template = document.getElementById('previewTemplate').value;
            const previewEl = document.getElementById('resumePreview');
            previewEl.innerHTML = '<div class="loading"><span class="spinner"></span> 渲染中...</div>';
            try {
                const res = await fetch(`/api/resume/${selectedResumeId}/preview?template=${template}`);
                if (!res.ok) { const data = await res.json(); throw new Error(data.detail); }
                const html = await res.text();
                previewEl.innerHTML = `<iframe srcdoc="${html.replace(/"/g, '&quot;')}"></iframe>`;
            } catch (e) { previewEl.innerHTML = `<p class="error">预览失败: ${e.message}</p>`; }
        }

        async function downloadResume(format) {
            if (!selectedResumeId) return alert('请先选择一个简历快照');
            const template = document.getElementById('previewTemplate').value;
            window.open(`/api/resume/${selectedResumeId}/download?format=${format}&template=${template}`);
        }

        async function deleteResume(id) {
            if (!confirm(`确定删除简历 ${id}？`)) return;
            try {
                const res = await fetch(`/api/resume/${id}`, { method: 'DELETE' });
                if (res.ok) { if (selectedResumeId === id) selectedResumeId = null; loadResumeList(); }
                else { const data = await res.json(); alert('删除失败: ' + data.detail); }
            } catch (e) { alert('删除失败: ' + e.message); }
        }

        // ---- 工具/技能/会话 ----
        async function loadTools() {
            const el = document.getElementById('toolsList');
            try {
                const res = await fetch('/api/tools');
                const data = await res.json();
                if (!data.tools || data.tools.length === 0) { el.innerHTML = '<p style="color:#999">暂无工具</p>'; return; }
                el.innerHTML = data.tools.map(t => `<div style="margin-bottom:12px;padding:10px;background:#f9f9f9;border-radius:6px">
                    <strong>${t.name}</strong><span class="badge badge-green" style="margin-left:8px">可用</span>
                    <p style="font-size:12px;color:#666;margin-top:4px">${t.description}</p>
                </div>`).join('');
            } catch (e) { el.innerHTML = `<p class="error">加载失败</p>`; }
        }

        async function loadSkills() {
            const el = document.getElementById('skillsList');
            try {
                const res = await fetch('/api/skills');
                const data = await res.json();
                if (!data.skills || data.skills.length === 0) { el.innerHTML = '<p style="color:#999">暂无技能</p>'; return; }
                el.innerHTML = data.skills.map(s => `<div style="margin-bottom:8px;padding:8px;background:#f9f9f9;border-radius:6px">
                    <strong>${s.name}</strong> ${s.found ? '<span class="badge badge-green">已加载</span>' : '<span class="badge badge-red">未找到</span>'}
                    ${s.preview ? `<p style="font-size:11px;color:#888;margin-top:4px">${s.preview}</p>` : ''}
                </div>`).join('');
            } catch (e) { el.innerHTML = `<p class="error">加载失败</p>`; }
        }

        async function loadMcpStatus() {
            const el = document.getElementById('mcpStatus');
            try {
                const res = await fetch('/api/mcp/status');
                const data = await res.json();
                el.innerHTML = `<p><span class="badge badge-blue">${data.status}</span></p>
                    <p style="font-size:12px;color:#888;margin-top:4px">${data.message || ''}</p>`;
            } catch (e) { el.innerHTML = `<p class="error">加载失败</p>`; }
        }

        async function loadSessions() {
            const el = document.getElementById('sessionsList');
            try {
                const res = await fetch('/api/sessions');
                const data = await res.json();
                if (!data.sessions || data.sessions.length === 0) { el.innerHTML = '<p style="color:#999">暂无历史会话</p>'; return; }
                el.innerHTML = data.sessions.map(s => {
                    const date = new Date(s.created_at * 1000).toLocaleString();
                    return `<div style="margin-bottom:6px;padding:6px 8px;background:#f9f9f9;border-radius:4px;font-size:12px">
                        <strong>${s.session_id}</strong> - ${s.summary || '无摘要'} <span style="color:#999">(${s.message_count}条, ${date})</span>
                    </div>`;
                }).join('');
            } catch (e) { el.innerHTML = `<p class="error">加载失败</p>`; }
        }

        // ---- 配置 ----
        async function loadSettings() {
            try {
                const res = await fetch('/api/settings');
                const data = await res.json();
                document.getElementById('settingTemplate').value = data.default_template || 'professional';
                document.getElementById('settingStyle').value = data.language_style || 'professional';
                document.getElementById('settingLang').value = data.output_language || 'zh-CN';
                document.getElementById('settingAutoSave').value = String(data.auto_save_resume ?? true);
            } catch (e) {}
        }

        async function saveSettings() {
            const body = {
                default_template: document.getElementById('settingTemplate').value,
                language_style: document.getElementById('settingStyle').value,
                output_language: document.getElementById('settingLang').value,
                auto_save_resume: document.getElementById('settingAutoSave').value === 'true',
            };
            try {
                const res = await fetch('/api/settings', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                if (res.ok) alert('配置已保存');
                else { const data = await res.json(); alert('保存失败: ' + JSON.stringify(data)); }
            } catch (e) { alert('保存失败: ' + e.message); }
        }

        // ---- 页面加载时初始化 ----
        loadSettings();
    </script>
</body>
</html>
